version: '3.8'

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: pathway-gotenberg
    restart: unless-stopped
    # Internal port only. NEVER map 3000 to host.
    expose:
      - "3000"
    environment:
      - LOG_LEVEL=info
      # Disabling Google Chrome saves ~150 MB RAM; LibreOffice handles Office docs
      - DISABLE_GOOGLE_CHROME=1
    deploy:
      resources:
        limits:
          memory: 1200M
          cpus: '1.2'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - tools-net

  tools-api:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: pathway-tools-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CONVERSION_PROVIDER=gotenberg
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_TIMEOUT_MS=60000
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=/tmp/pathway-tools
      - MAX_UPLOAD_SIZE_MB=25
      - CONVERSION_TIMEOUT_MS=60000
      - FILE_RETENTION_MINUTES=60
      - JOB_METADATA_RETENTION_HOURS=24
      - RATE_LIMIT_MAX_REQUESTS=20
      - RATE_LIMIT_WINDOW_SECONDS=60
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - TOOLS_API_KEY=${TOOLS_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      gotenberg:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
        reservations:
          memory: 256M
    volumes:
      - tools-storage:/tmp/pathway-tools
    networks:
      - tools-net

volumes:
  tools-storage:

networks:
  tools-net:
    driver: bridge

